services:
  mcp-server:
    build: .
    container_name: MariaDB-MCP
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      - DB_CHARSET=${DB_CHARSET}
      - DB_SSL=${DB_SSL}
      - DB_SSL_CA=${DB_SSL_CA}
      - DB_SSL_CERT=${DB_SSL_CERT}
      - DB_SSL_KEY=${DB_SSL_KEY}
      - DB_SSL_VERIFY_CERT=${DB_SSL_VERIFY_CERT}
      - DB_SSL_VERIFY_IDENTITY=${DB_SSL_VERIFY_IDENTITY}
      - MCP_READ_ONLY=${MCP_READ_ONLY}
      - MCP_MAX_POOL_SIZE=${MCP_MAX_POOL_SIZE}
      - LOG_LEVEL=${LOG_LEVEL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
    volumes:
      - ./logs:/app/logs
      # SSL certs: descomentar solo si DB_SSL=true y los certificados existen
      # - ./ssl/ca.pem:/certs/ca.pem:ro
      # - ./ssl/client-cert.pem:/certs/client-cert.pem:ro
      # - ./ssl/client-key.pem:/certs/client-key.pem:ro
    ports:
      - "${PORT:-3005}:3000"
    # Iniciar en modo HTTP para que el healthcheck funcione
    command: ["node", "src/index.js", "--http", "3000"]
    # Red para comunicarse con MariaDB (adaptador tipo host)
    network_mode: ${NETWORK_MODE:-bridge}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  ## Para usar via stdio (ejecutar una sola vez):
  ##   docker compose run --rm mcp-server
  ##
  ## Para HTTP (servidor permanente):
  ##   docker compose up -d
  ##   Luego configurar el cliente MCP con url: http://localhost:3000
